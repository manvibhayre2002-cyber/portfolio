<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Inbox — Manvi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&family=Questrial&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f3f3f1; --ink: #212121; --mute: #8a8a87; --line: #d9d9d5; --orange: #e24000; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.45 'Poppins', sans-serif; }
  button, input, textarea { font: inherit; color: inherit; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--ink); }
  header img { height: 28px; display: block; }
  header h1 { margin: 0; font: 400 18px 'Questrial', sans-serif; letter-spacing: .5px; }
  .ghost { background: none; border: 1px solid var(--ink); border-radius: 17px; padding: 4px 14px; cursor: pointer; }
  .ghost:hover { background: var(--ink); color: var(--bg); }

  /* sign in */
  #login { max-width: 340px; margin: 18vh auto 0; padding: 0 20px; display: flex; flex-direction: column; gap: 12px; }
  #login p { margin: 0; color: var(--mute); }
  #login input { padding: 12px 14px; border: 1px solid var(--ink); border-radius: 4px; background: #fff; }
  .primary { background: var(--orange); color: #fff; border: 0; border-radius: 4px; padding: 12px 14px; cursor: pointer; }
  .primary:disabled { opacity: .6; }
  .err { color: #b3261e; min-height: 1.4em; }

  /* inbox: list + thread */
  #app { display: none; height: calc(100% - 61px); }
  #app.on { display: grid; grid-template-columns: minmax(240px, 340px) 1fr; }
  #list { border-right: 1px solid var(--line); overflow-y: auto; }
  .row { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 14px 18px; cursor: pointer; }
  .row:hover, .row.on { background: #e9e9e5; }
  .row .top { display: flex; justify-content: space-between; gap: 8px; font-weight: 500; }
  .row .when { color: var(--mute); font-weight: 400; font-size: 12px; white-space: nowrap; }
  .row .prev { color: #555; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .dot { display: inline-block; min-width: 18px; padding: 0 6px; border-radius: 9px; background: var(--orange); color: #fff; font-size: 11px; text-align: center; margin-left: 6px; }
  .empty { padding: 40px 20px; color: var(--mute); text-align: center; }

  #thread { display: flex; flex-direction: column; min-height: 0; }
  #thread .bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--line); }
  #msgs { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .m { max-width: min(78%, 520px); padding: 9px 13px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .m small { display: block; font-size: 11px; opacity: .65; margin-top: 3px; }
  .m.visitor { align-self: flex-start; background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 3px; }
  .m.manvi { align-self: flex-end; background: var(--orange); color: #fff; border-bottom-right-radius: 3px; }
  form#reply { display: flex; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--line); }
  form#reply textarea { flex: 1; resize: none; height: 46px; padding: 11px 13px; border: 1px solid var(--ink); border-radius: 4px; background: #fff; }
  .back { display: none; }

  @media (max-width: 700px) {
    #app.on { grid-template-columns: 1fr; }
    #app.on.reading #list { display: none; }
    #app.on:not(.reading) #thread { display: none; }
    .back { display: inline-block; }
  }
</style>
</head>
<body>
<header>
  <a href="/" aria-label="Back to the site"><img src="assets/logo-small.svg" alt="Manvi"></a>
  <h1>Inbox</h1>
  <button class="ghost" id="out" hidden>Sign out</button>
</header>

<form id="login" autocomplete="on">
  <p>Messages people send from the “Work with me” chat.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Inbox password" aria-label="Inbox password" required>
  <button class="primary" id="go">Open inbox</button>
  <div class="err" id="err" role="alert"></div>
</form>

<main id="app">
  <nav id="list" aria-label="Conversations"></nav>
  <section id="thread" aria-label="Conversation">
    <div class="bar"><button class="ghost back" id="back">← All</button><span id="who"></span><button class="ghost" id="del">Delete</button></div>
    <div id="msgs" aria-live="polite"></div>
    <form id="reply"><textarea id="text" maxlength="600" placeholder="Write a reply…" aria-label="Reply"></textarea><button class="primary">Send</button></form>
  </section>
</main>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  let key = sessionStorage.getItem('mb-inbox') || '';
  let open = null, timer = null;

  const api = async (path, opts = {}) => {
    const r = await fetch('/api/inbox' + path, { ...opts, headers: { 'x-inbox-key': key, 'Content-Type': 'application/json', ...(opts.headers || {}) } });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(j.error || r.status), { status: r.status });
    return j;
  };
  const when = (t) => {
    const d = new Date(t), now = new Date();
    return d.toDateString() === now.toDateString()
      ? d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
      : d.toLocaleDateString([], { day: 'numeric', month: 'short' }) + ', ' + d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  };
  const label = (cid) => 'Visitor ' + cid.slice(0, 4).toUpperCase();

  async function loadList() {
    const { conversations } = await api('');
    const list = $('#list');
    list.innerHTML = conversations.length ? '' : '<div class="empty">No messages yet.</div>';
    conversations.forEach((c) => {
      const b = document.createElement('button');
      b.className = 'row' + (c.cid === open ? ' on' : '');
      const top = document.createElement('div'); top.className = 'top';
      const name = document.createElement('span'); name.textContent = label(c.cid);
      if (c.unread) { const d = document.createElement('span'); d.className = 'dot'; d.textContent = c.unread; name.appendChild(d); }
      const w = document.createElement('span'); w.className = 'when'; w.textContent = when(c.at);
      top.append(name, w);
      const p = document.createElement('div'); p.className = 'prev';
      p.textContent = c.last ? (c.last.from === 'manvi' ? 'You: ' : '') + c.last.text : '';
      b.append(top, p);
      b.onclick = () => show(c.cid);
      list.appendChild(b);
    });
  }

  async function show(cid) {
    open = cid;
    $('#app').classList.add('reading');
    $('#who').textContent = label(cid);
    const { messages } = await api('?cid=' + encodeURIComponent(cid));
    const box = $('#msgs');
    box.innerHTML = '';
    messages.forEach((m) => {
      const d = document.createElement('div'); d.className = 'm ' + m.from;
      d.textContent = m.text;
      const s = document.createElement('small'); s.textContent = when(m.at); d.appendChild(s);
      box.appendChild(d);
    });
    box.scrollTop = box.scrollHeight;
    loadList();
  }

  async function enter() {
    $('#err').textContent = '';
    try {
      await loadList();
      sessionStorage.setItem('mb-inbox', key);
      $('#login').style.display = 'none';
      $('#app').classList.add('on');
      $('#out').hidden = false;
      clearInterval(timer);
      timer = setInterval(() => { if (!document.hidden) (open ? show(open) : loadList()).catch(() => {}); }, 20000);
    } catch (e) {
      sessionStorage.removeItem('mb-inbox');
      $('#err').textContent = e.status === 401 ? 'That password didn’t work.' :
        e.status === 503 ? 'The inbox isn’t set up on Vercel yet (storage or password missing).' : 'Couldn’t reach the inbox. Try again.';
    }
  }

  $('#login').addEventListener('submit', (e) => { e.preventDefault(); key = $('#pw').value; enter(); });
  $('#reply').addEventListener('submit', async (e) => {
    e.preventDefault();
    const t = $('#text').value.trim();
    if (!t || !open) return;
    $('#text').value = '';
    try { await api('', { method: 'POST', body: JSON.stringify({ cid: open, text: t }) }); show(open); }
    catch (_) { $('#text').value = t; alert('Reply not sent. Try again.'); }
  });
  $('#text').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#reply').requestSubmit(); } });
  $('#del').addEventListener('click', async () => {
    if (!open || !confirm('Delete this conversation for good? This can’t be undone.')) return;
    await api('', { method: 'POST', body: JSON.stringify({ cid: open, del: 1 }) });
    open = null; $('#app').classList.remove('reading'); $('#msgs').innerHTML = ''; $('#who').textContent = ''; loadList();
  });
  $('#back').addEventListener('click', () => { $('#app').classList.remove('reading'); open = null; loadList(); });
  $('#out').addEventListener('click', () => { sessionStorage.removeItem('mb-inbox'); location.reload(); });

  if (key) enter();
})();
</script>
</body>
</html>
