<script>
  // phones get the phone design; narrow or portrait tablets get the stacked layout
  if (innerWidth < 600) document.documentElement.classList.add('phone');
  else if (innerWidth < 900 || innerWidth / innerHeight < 0.9) document.documentElement.classList.add('stack');
  // intro plays whenever the site is opened or refreshed — not when moving between its own pages
  try {
    var siteRoot = location.origin + location.pathname.replace(/(projects\/)?[^\/]*$/, '');
    var fromInside = document.referrer.indexOf(siteRoot) === 0;
    var nav = (performance.getEntriesByType && performance.getEntriesByType('navigation')[0] || {}).type;
    if (!fromInside || nav === 'reload' || location.search.indexOf('loader') > -1) document.documentElement.classList.add('loading', 'logo-pending');
  }
  catch (e) { document.documentElement.classList.add('loading', 'logo-pending'); }
  // arriving from About via the "ABOUT → Hey" transition
  try { if (sessionStorage.getItem('mb-yeh')) { sessionStorage.removeItem('mb-yeh'); document.documentElement.classList.add('hold', 'from-about', 'hey-return'); } } catch (e) {}
</script>
